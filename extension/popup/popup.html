<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../images/icon-48.png" alt="" width="28" height="28">
    <h1>Блокировщик рекламы</h1>
  </header>
  <main>
    <div class="site" id="site">—</div>
    <label class="switch-row">
      <span id="state-text">Блокировка включена</span>
      <input type="checkbox" id="toggle" checked>
      <span class="switch"></span>
    </label>
    <p class="hint" id="hint">Реклама, всплывающие окна и реклама в видео блокируются.</p>
    <button id="reload" hidden>Обновить страницу</button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
